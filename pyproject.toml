[project]
name = "hkmj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
constraint-dependencies = ["verifiers==0.3.1"]

[tool.uv.sources]
hkmj-core = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "hypothesis>=6.156.9",
    "pydantic>=2.12",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.61",
]
