[project]
name = "hkmj-human"
version = "0.1.0"
description = "A terminal-operated OpenAI-compatible player endpoint"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["starlette>=0.47", "uvicorn>=0.35", "prompt-toolkit>=3.0.51"]

[project.scripts]
hkmj-human = "hkmj_human:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
