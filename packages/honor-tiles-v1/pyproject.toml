description = "A Verifiers taskset for recognizing Hong Kong mahjong honor tiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hkmj-core",
    "verifiers",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
